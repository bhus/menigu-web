<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Welcome to Kaháwi — Web framework in Kotlin</title>
  <style>
    :root{
      --bg:#fbf8f4;
      --accent:#0077cc; /* blue to match logo */
      --accent-2:#ffb347; /* orange */
      --muted:#586069;
      --max-width:1000px;
      --radius:12px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:#111;}
    .container{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 20px;
    }
    .card{
      width:100%;
/*      max-width:560px;*/
      background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.8));
      border-radius:var(--radius);
      box-shadow:0 8px 30px rgba(15,15,15,0.06);
      display:grid;
      grid-template-columns: 380px 1fr;
      gap:30px;
      width:auto;
      padding:36px;
      align-items:center;
    }
    @media (max-width:880px){
      .card {
        display:grid;
        width:auto;
        grid-template-columns: 1fr;
        padding: 7px;
        text-align: center;
      }
    }
    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex-direction: column;
      background: linear-gradient(180deg, #fdf8f1, #f9f4ec);
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.04);
    }
    .logo-wrap img {
      width: 280px;
      max-width: 80%;
      height: auto;
      display: block;
      border-radius: 16px;
    }
    .card:hover .logo-wrap {
      box-shadow: inset 0 0 14px rgba(0,0,0,0.06);
      transform: scale(1.01);
      transition: all 0.3s ease;
    }
    .blurb-wrap {
      background-color: #fff;
      padding:7px;
      min-width: 0px;
    }
    h1{margin:0;font-size:30px;letter-spacing:-0.01em;}
    p.lead{margin:12px 0 20px;color:var(--muted);line-height:1.45;font-size:16px;}
    .cta{
      display:flex;
      gap:12px;
      align-items:center;
      margin-top:8px;
    }
    .btn{
      background:var(--accent);
      color:white;
      padding:12px 18px;
      border-radius:10px;
      text-decoration:none;
      font-weight:600;
      box-shadow:0 6px 18px rgba(0,119,204,0.18);
    }
    .btn.ghost{
      background:transparent;
      color:var(--accent);
      border:1px solid rgba(0,119,204,0.12);
      box-shadow:none;
      font-weight:600;
      padding:10px 16px;
    }
    .meta{
      background:#fff;
      border-radius:10px;
      padding:7px;
      box-shadow:0 6px 7px rgba(12,12,12,0.04);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", monospace;
      font-size:14px;
      color:#0b1b2b;
      text-align: left;
    }
    footer{margin-top:18px;color:var(--muted);font-size:13px;}
    .tag{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(0,119,204,0.06);color:var(--accent);font-weight:600;font-size:13px;margin-bottom:12px}
    .docs {
      background: #f9f7f4;
      padding: 80px 20px;
      border-top: 1px solid rgba(0,0,0,0.05);
    }
    .docs-inner {
      max-width: var(--max-width);
      margin: 0 auto;
    }
    /* Sticky nav */
    .docs-nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(249,247,244,0.85);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      gap: 24px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .docs-nav a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background 0.2s ease;
    }
    .docs-nav a:hover {
      background: rgba(0,119,204,0.08);
    }
    /* Only center h2 elements that are direct children of docs-inner */
    .docs-inner > h2 {
      font-size: 26px;
      margin-bottom: 12px;
      text-align: center;
    }
    /* Keep headings inside posts left-aligned */
    .doc-item h2 {
      text-align: left;
    }
    .doc-item {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 6px 14px rgba(0,0,0,0.04);
      padding: 24px 28px;
      margin-bottom: 28px;
    }
    /* Target only the intro paragraph */
    .docs-inner > p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      text-align: center;
      max-width: 700px;
      margin: 0 auto 40px;
    }
    /* Default text alignment for content inside doc-item */
    .doc-item p {
      text-align: left;
      line-height: 1.6;
    }
    .doc-item h3 {
      color: var(--accent);
      margin-bottom: 10px;
      font-size: 18px;
    }
    pre {
      background: #f4f4f4;
      border-radius: 10px;
      padding: 14px;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", monospace;
      font-size: 14px;
      line-height: 1.5;
      color: #0b1b2b;
    }
    code {
      background: transparent;
    }
  </style>
</head>
<body>

  <div class="docs">
  <div class="docs-inner">
    <article class="doc-item">
      <header>
        <h1>Welcome to Kaháwi</h1>
        <p style="font-size: 14px; color: var(--muted);">January 01, 2024</p>
      </header>
      <p>This is the first post on the Kaháwi blog. We are excited to share updates and articles about the framework.
Stay tuned for more content!</p>

    </article>
  </div>
</div>

</body>
</html>
