---
layout: default
---
<div class="docs">
  <div class="docs-inner">
    <article class="doc-item">
      <header>
        <h1>{{ page.title }}</h1>
        <p style="font-size: 14px; color: var(--muted);">{{ page.date | date: "%B %d, %Y" }}</p>
      </header>
      {{ content }}
    </article>
  </div>
</div>
